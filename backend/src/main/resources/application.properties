# Cổng chạy ứng dụng (dùng 8081 vì 8080 đang bị chiếm bởi AgentService)
server.port=8080

# Cấu hình CSDL SQL Server kết nối qua 127.0.0.1:1433
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=EventCraft;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cấu hình bí mật JWT (Secret Key & Thời hạn 24 giờ)
app.jwt.secret=EventCraftSecretKeyForSWP391Fall2026SuperSecureKeyWithEnoughLength256Bits
app.jwt.expiration-ms=86400000
